<div id="authGate" class="auth-gate"><div class="auth-card"><div class="brand">🟩 RollLerd POS & Business</div><h2>เข้าสู่ระบบเจ้าของร้าน</h2><p class="muted">ข้อมูลร้านจะบันทึกและซิงก์ผ่าน Supabase</p><label>อีเมลเจ้าของร้าน</label><input id="authEmail" type="email" autocomplete="username" placeholder="owner@example.com"><label>รหัสผ่าน</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button class="primary" id="authLogin" style="width:100%">เข้าสู่ระบบ</button><div id="authStatus" class="cloud-status">กรุณาตั้งค่า Supabase ในไฟล์ supabase/config.js ก่อนใช้งาน</div></div></div><div class="app"><aside class="side"><div class="brand">🟩 RollLerd<br><span class="muted">POS & Business · โรลเลิศ โรลดี</span></div><nav class="nav" id="nav">

<main><div class="top"><div><div class="muted" id="date"></div><h1 id="title">ภาพรวมร้าน</h1></div><div><span class="tag">Owner only</span> <button id="signOut">ออกจากระบบ</button> <button id="lang">EN</button> <button class="primary" id="add">+ เพิ่มรายการ</button></div></div><div id="content"></div></main></div>

<script>
const $=x=>document.getElementById(x), money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const seed={
tasks:[['ตรวจวัตถุดิบและวันหมดอายุ','เจ้าของร้าน','รอดำเนินการ'],['เตรียมไส้และเครื่องเคียง','ทีมครัว','รอดำเนินการ'],['เตรียมบรรจุภัณฑ์','ทีมหน้าร้าน','รอดำเนินการ'],['สรุปยอดขายหลังปิดร้าน','เจ้าของร้าน','รอดำเนินการ']],
plans:[['ทดลองขาย 4 วัน','กำหนดภายหลัง','20 กล่อง/วัน · 80 กล่องรวม','วางแผน']],
products:[['ปอเปี๊ยะธรรมดา','RL-N01',55],['ปอเปี๊ยะชีส','RL-C01',65],['ปอเปี๊ยะข้าวซอย','RL-K01',65]],
ingredients:[
['แผ่นปอเปี๊ยะ 8.5 นิ้ว',83,40,'แผ่น','ราคาแจ้งแล้ว'],['อกไก่',96,1000,'กรัม','1 กก.'],['หมูบด',132,1000,'กรัม','1 กก.'],['แครอท',10,1,'ลูก','ต่อลูก'],['กะหล่ำปลี',32,1000,'กรัม','ราคาต่อกก.; น้ำหนักใช้เป็นสมมติฐาน'],['วุ้นเส้นต้นสน',8,40,'กรัม','ห่อ 40 กรัม'],['เนย',129,2000,'กรัม','ขนาด 2 กก. เป็นสมมติฐาน'],['หอมใหญ่',37,1000,'กรัม','น้ำหนักใช้เป็นสมมติฐาน'],['น้ำมันพืช',270,5000,'มล.','ถัง 5 ลิตร; ปริมาณใช้จริงรอยืนยัน'],['พริก',105,1000,'กรัม','ต่อกก.'],['น้ำตาล',23,1000,'กรัม','ต่อกก.'],['น้ำส้มสายชู',45,1000,'มล.','ขวด 1 ลิตร'],['เชดด้าชีส',785,2000,'กรัม','แพ็ก 2 กก.'],['พาร์เมซาน',339,500,'กรัม','แพ็ก 500 กรัม'],['พริกแกงข้าวซอย',169,500,'กรัม','แพ็ก 500 กรัม'],['หอมแดง',29,500,'กรัม','แพ็ก 500 กรัม'],['หัวกะทิ',73,1000,'มล.','ประมาณการ 73 บาท/ลิตร'],['หางกะทิ',73,1000,'มล.','ประมาณการ 73 บาท/ลิตร'],['มะนาว',5.5,1,'ลูก','ต่อลูก'],['ผักสลัด',35,300,'กรัม','แพ็ก 300 กรัม'],['ผักดอง',73,1000,'กรัม','ต่อกก.'],['หอมเจียว',95,500,'กรัม','แพ็ก 500 กรัม'],['เส้นทอด',55,500,'กรัม','แพ็ก 500 กรัม'],['กล่องอาหาร',1.5,1,'ใบ','ราคาต่อใบ']],
recipes:[{name:'ไส้ปอเปี๊ยะพื้นฐาน',yield:40,unit:'ชิ้น',note:'สูตรต่อ 40 ชิ้น; น้ำหนักผักบางรายการเป็นสมมติฐาน',lines:[['อกไก่',330],['หมูบด',400],['แครอท',1],['กะหล่ำปลี',150],['วุ้นเส้นต้นสน',40],['เนย',30],['หอมใหญ่',225]]},{name:'น้ำจิ้มธรรมดา',yield:520,unit:'กรัม',note:'Yield 520g เป็นสมมติฐาน รอชั่งจริง',lines:[['พริก',300],['น้ำตาล',200],['น้ำส้มสายชู',20]]},{name:'ซอสข้าวซอย',yield:1415,unit:'กรัม',note:'Yield 1,415g เป็นสมมติฐาน; ปริมาณต่อกล่องเคยระบุทั้ง 60g และ 80g ต้องยืนยัน',lines:[['พริกแกงข้าวซอย',100],['หอมแดง',40],['หัวกะทิ',375],['หางกะทิ',375]]}],
sales:[],expenses:[],stock:[],staff:[]};
let db=JSON.parse(localStorage.getItem('rolllerd_full')||'null')||seed, page='dashboard',role='owner';
db.purchasePlan=db.purchasePlan||{};db.stock=db.stock||[];
db.ingredients.forEach(x=>{if(!db.purchasePlan[x[0]])db.purchasePlan[x[0]]={plannedQty:0,purchased:false,purchaseDate:'',buyer:'',receivedQty:0,unit:x[3]};});
function stockQty(name){return db.stock.filter(x=>x.name===name).reduce((s,x)=>s+Number(x.qty||0),0)}
function receivePurchase(name){const p=db.purchasePlan[name],old=Number(p.receivedQty||0),raw=prompt('จำนวนที่รับเข้าจริง ('+p.unit+')',String(old));if(raw===null)return;const next=Number(raw);if(!Number.isFinite(next)||next<0){alert('กรุณาใส่จำนวนที่ถูกต้อง');return;}const delta=next-old;if(delta!==0){let s=db.stock.find(x=>x.name===name);if(!s){s={name,qty:0,unit:p.unit};db.stock.push(s)}s.qty=Number(s.qty||0)+delta;}p.receivedQty=next;if(!p.purchased){p.purchased=true;p.purchaseDate=new Date().toISOString().slice(0,10);p.buyer='เจ้าของร้าน';}save();}
function markPurchased(name,checked){const p=db.purchasePlan[name];p.purchased=checked;if(checked){if(!p.purchaseDate)p.purchaseDate=new Date().toISOString().slice(0,10);if(!p.buyer)p.buyer='เจ้าของร้าน';}else if(Number(p.receivedQty||0)>0){alert('รับของเข้าสต็อกแล้ว กรุณาปรับจำนวนรับเป็น 0 ก่อนยกเลิก');p.purchased=true;return;}save();}
function editPurchase(name){const p=db.purchasePlan[name],q=prompt('จำนวนที่วางแผนซื้อ ('+p.unit+')',String(p.plannedQty||0));if(q===null)return;p.plannedQty=Math.max(0,Number(q)||0);const d=prompt('วันที่ซื้อ (YYYY-MM-DD)',p.purchaseDate||new Date().toISOString().slice(0,10));if(d===null)return;p.purchaseDate=d;const b=prompt('ใครเป็นคนซื้อ',p.buyer||'เจ้าของร้าน');if(b===null)return;p.buyer=b;save();}
const names={dashboard:'ภาพรวมร้าน',tasks:'สิ่งที่ต้องทำ',plans:'แผนงาน',products:'สินค้าและเมนู',ingredients:'วัตถุดิบและราคา',recipes:'สูตรอาหารและ Yield',purchases:'แผนซื้อของ',sales:'ยอดขาย',stock:'สต็อก',accounts:'บัญชีรายรับ-รายจ่าย',finance:'การเงินและกำไร',staff:'พนักงานและค่าแรง',reports:'รายงาน',settings:'ตั้งค่าร้าน'};
let cloudVersion=null,cloudReady=false,cloudQueue=Promise.resolve();
function save(){localStorage.setItem('rolllerd_full',JSON.stringify(db));render();if(cloudReady){const snapshot=JSON.parse(JSON.stringify(db));cloudQueue=cloudQueue.then(()=>RollLerdCloud.saveState(snapshot,cloudVersion)).then(v=>{cloudVersion=v.version;setCloudStatus('บันทึกและซิงก์ข้อมูลแล้ว')}).catch(e=>{setCloudStatus('บันทึกออนไลน์ไม่สำเร็จ: '+(e.message||e));});}}
function total(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function cost(name,q){let x=db.ingredients.find(v=>v[0]===name);return x?x[1]*q/x[2]:0}
function recipeCost(r){return r.lines.reduce((s,x)=>s+cost(x[0],x[1]),0)}
function table(h,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows||'<tr><td colspan="'+h.length+'" class="empty">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>`}
function del(k,i){if(confirm('ยืนยันลบ?')){db[k].splice(i,1);save()}}
function addTask(){let n=prompt('ชื่องาน');if(n)db.tasks.push([n,prompt('ผู้รับผิดชอบ')||'-','รอดำเนินการ']);save()}
function addPlan(){let n=prompt('ชื่อแผน');if(n)db.plans.push([n,prompt('กำหนดวัน')||'-',prompt('เป้าหมาย')||'-','วางแผน']);save()}
function addProduct(){let n=prompt('ชื่อเมนู');if(n)db.products.push([n,'NEW-'+Date.now(),Number(prompt('ราคาขายบาท')||0)]);save()}
function addIngredient(){let n=prompt('ชื่อวัตถุดิบ');if(n){let u=prompt('หน่วย')||'กรัม';db.ingredients.push([n,Number(prompt('ราคาซื้อ')||0),Number(prompt('ปริมาณแพ็ก')||1),u,'เพิ่มเอง']);db.purchasePlan[n]={plannedQty:0,purchased:false,purchaseDate:'',buyer:'',receivedQty:0,unit:u};}save()}
function addRecipe(){let n=prompt('ชื่อสูตร');if(n)db.recipes.push({name:n,yield:Number(prompt('Yield')||1),unit:prompt('หน่วย')||'กรัม',note:'สูตรใหม่',lines:[]});save()}
function addSale(){let n=prompt('เมนูที่ขาย');if(n)db.sales.push({name:n,qty:Number(prompt('จำนวนกล่อง')||1),amount:Number(prompt('ยอดขายบาท')||0),date:new Date().toLocaleDateString('th-TH'),by:role});save()}
function addExpense(){let n=prompt('รายการจ่าย');if(n)db.expenses.push({name:n,amount:Number(prompt('จำนวนเงิน')||0),date:new Date().toLocaleDateString('th-TH'),by:role});save()}
function addStock(){let n=prompt('วัตถุดิบ');if(n)db.stock.push({name:n,qty:Number(prompt('จำนวน')||0),unit:prompt('หน่วย')||'-'});save()}
function addStaff(){let n=prompt('ชื่อพนักงาน');if(n)db.staff.push({name:n,job:prompt('ตำแหน่ง')||'พนักงาน',rate:Number(prompt('ค่าแรง/ชม.')||0),hours:Number(prompt('ชั่วโมง')||0)});save()}
function render(){
$('title').textContent=names[page];document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page));
let rev=total(db.sales),exp=total(db.expenses),html='';
if(page==='dashboard')html=`<div class="grid"><div class="card"><div class="muted">ยอดขายสะสม</div><div class="metric">${money(rev)}</div>${db.sales.length} รายการ</div><div class="card"><div class="muted">รายจ่ายร้าน</div><div class="metric">${money(exp)}</div></div><div class="card owner-only"><div class="muted">คงเหลือหลังรายจ่ายที่บันทึก</div><div class="metric">${money(rev-exp)}</div></div><div class="card"><div class="muted">จำนวนเมนู</div><div class="metric">${db.products.length}</div></div></div><div class="two"><div class="card"><h2>แผนทดลองขาย</h2><div class="metric">80 กล่อง / 320 ชิ้น</div><div class="row">ธรรมดา <b>40 กล่อง</b></div><div class="row">ชีส <b>20 กล่อง</b></div><div class="row">ข้าวซอย <b>20 กล่อง</b></div><p class="muted">4 วัน × 20 กล่อง/วัน · 4 ชิ้น/กล่อง</p></div><div class="card"><h2>งานค้าง</h2>${db.tasks.filter(x=>x[2]!=='เสร็จแล้ว').map(x=>`<div class="row">${x[0]} <span class="tag">${x[2]}</span></div>`).join('')}</div></div><div class="warn">ยอดคงเหลือยังไม่ใช่กำไรสุทธิ เพราะยังไม่หักต้นทุนขายตามสูตร ค่าแรง และค่าใช้จ่ายที่ยังไม่ได้บันทึก</div>`;
if(page==='tasks')html=`<div class="head"><h2>รายการงาน</h2><button class="primary" onclick="addTask()">+ เพิ่มงาน</button></div>${table(['งาน','ผู้รับผิดชอบ','สถานะ','จัดการ'],db.tasks.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><button onclick="db.tasks[${i}][2]=db.tasks[${i}][2]==='เสร็จแล้ว'?'รอดำเนินการ':'เสร็จแล้ว';save()">${x[2]}</button></td><td><button onclick="del('tasks',${i})">ลบ</button></td></tr>`).join(''))}`;
if(page==='plans')html=`<div class="head"><h2>แผนงานร้าน</h2><button class="primary" onclick="addPlan()">+ เพิ่มแผน</button></div>${table(['แผน','กำหนดวัน','เป้าหมาย','สถานะ','จัดการ'],db.plans.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><button onclick="del('plans',${i})">ลบ</button></td></tr>`).join(''))}`;

if(page==='ingredients')html=`<div class="head"><h2>วัตถุดิบและราคาซื้อ</h2><button class="primary" onclick="addIngredient()">+ เพิ่มวัตถุดิบ</button></div>${table(['วัตถุดิบ','ราคาซื้อ','ปริมาณแพ็ก','หน่วย','ต้นทุน/หน่วย','หมายเหตุ','แก้ไข'],db.ingredients.map((x,i)=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${money(x[1]/x[2])}</td><td>${x[4]}</td><td><button onclick="db.ingredients[${i}][1]=Number(prompt('ราคา',db.ingredients[${i}][1])||db.ingredients[${i}][1]);save()">แก้ราคา</button></td></tr>`).join(''))}<div class="warn">ค่าประมาณที่ยังต้องยืนยัน: ขนาดแพ็กเนย, น้ำหนักผักที่ใช้จริง, ปริมาณน้ำมันที่ใช้ทอดซ้ำ</div>`;
if(page==='recipes')html=`<div class="head"><h2>สูตรอาหารและ Yield</h2><button class="primary" onclick="addRecipe()">+ เพิ่มสูตร</button></div>${db.recipes.map((r,i)=>`<div class="card"><div class="head"><b>${r.name}</b><span class="tag">Yield ${r.yield} ${r.unit}</span></div><p class="muted">${r.note}</p><b>ต้นทุนส่วนผสม: ${money(recipeCost(r))}</b>${r.lines.map(l=>`<div class="row">${l[0]} <b>${l[1]}</b></div>`).join('')}<p><button onclick="let s=prompt('ใส่ส่วนผสม รูปแบบ วัตถุดิบ=จำนวน; คั่นด้วย ;',db.recipes[${i}].lines.map(x=>x.join('=')).join(';'));if(s!==null){db.recipes[${i}].lines=s.split(';').filter(Boolean).map(v=>[v.split('=')[0].trim(),Number(v.split('=')[1])||0]);save()}">แก้ส่วนผสม</button> <button onclick="del('recipes',${i})">ลบสูตร</button></p></div>`).join('')}<div class="warn">ซอสข้าวซอยมีปริมาณต่อกล่องที่เคยระบุ 60g และ 80g ต้องยืนยันก่อนคำนวณรอบผลิต; Yield 520g น้ำจิ้มและ 1,415g ซอสยังเป็นสมมติฐาน</div>`;
if(page==='purchases')html=`<div class="card"><h2>แผนซื้อของ · วัตถุดิบทั้งหมด</h2><p class="muted">กำหนดจำนวนที่ต้องซื้อ ติ๊กเมื่อซื้อแล้ว ระบุวันที่และผู้ซื้อ และบันทึกจำนวนรับจริงเพื่อเพิ่มเข้าสต็อก</p><div class="grid"><div><div class="metric">${db.ingredients.length}</div><div class="muted">รายการวัตถุดิบ</div></div><div><div class="metric">${Object.values(db.purchasePlan).filter(x=>x.purchased).length}</div><div class="muted">ซื้อแล้ว</div></div><div><div class="metric">${Object.values(db.purchasePlan).filter(x=>Number(x.receivedQty||0)>0).length}</div><div class="muted">รับของแล้ว</div></div><div><div class="metric">${money(db.ingredients.reduce((s,x)=>s+Number(db.purchasePlan[x[0]].plannedQty||0)*x[1]/x[2],0))}</div><div class="muted">มูลค่าตามแผนซื้อ</div></div></div></div>${table(['วัตถุดิบ','จำนวนที่ต้องซื้อ','สถานะซื้อ','วันที่ซื้อ','ผู้ซื้อ','รับเข้าจริง','ดำเนินการ'],db.ingredients.map(x=>{let p=db.purchasePlan[x[0]];return `<tr><td><b>${x[0]}</b><div class="muted">${money(x[1])}/${x[2]} ${x[3]}</div></td><td>${p.plannedQty||0} ${x[3]} <button onclick="editPurchase(${JSON.stringify(x[0])})">แก้แผน/วันที่/ผู้ซื้อ</button></td><td><label><input type="checkbox" ${p.purchased?'checked':''} onchange="markPurchased(${JSON.stringify(x[0])},this.checked)"> ซื้อแล้ว</label></td><td>${p.purchaseDate||'-'}</td><td>${p.buyer||'-'}</td><td>${p.receivedQty||0} ${x[3]}</td><td><button class="primary" onclick="receivePurchase(${JSON.stringify(x[0])})">บันทึกรับของ</button></td></tr>`}).join(''))}<div class="warn">การติ๊กซื้อแล้วบันทึกสถานะ วันที่ และผู้ซื้อ ส่วนสต็อกเพิ่มตามจำนวนรับเข้าจริงเท่านั้น หากรับของไม่ครบให้บันทึกจำนวนที่รับจริง</div>`;
if(page==='sales')html=`<div class="head"><h2>ยอดขาย</h2><button class="primary" onclick="addSale()">+ บันทึกยอดขาย</button></div>${table(['วันที่','เมนู','จำนวนกล่อง','ยอดขาย','ผู้บันทึก','จัดการ'],db.sales.map((x,i)=>`<tr><td>${x.date}</td><td>${x.name}</td><td>${x.qty}</td><td>${money(x.amount)}</td><td>${x.by}</td><td><button onclick="del('sales',${i})">ลบ</button></td></tr>`).join(''))}`;
if(page==='stock')html=`<div class="head"><h2>สต็อกวัตถุดิบทั้งหมด</h2><button class="primary" onclick="addStock()">+ ปรับยอด/เพิ่มรายการสต็อก</button></div><p class="muted">แสดงวัตถุดิบทุกชนิด แม้ยอดคงเหลือเป็นศูนย์ ของที่รับจากหน้าแผนซื้อจะแสดงที่นี่อัตโนมัติ</p>${table(['วัตถุดิบ','คงเหลือ','หน่วย','สถานะ','ข้อมูลซื้อเข้าล่าสุด'],db.ingredients.map(x=>{let p=db.purchasePlan[x[0]]||{},q=stockQty(x[0]);return `<tr><td>${x[0]}</td><td><b>${q}</b></td><td>${x[3]}</td><td>${q>0?'<span class="tag">มีสต็อก</span>':'<span class="muted">หมด/ยังไม่รับเข้า</span>'}</td><td>${p.purchased?'ซื้อ '+(p.purchaseDate||'-')+' · '+(p.buyer||'-')+' · รับ '+(p.receivedQty||0):'ยังไม่มีรายการซื้อ'}</td></tr>`}).join(''))}${db.stock.filter(s=>!db.ingredients.some(x=>x[0]===s.name)).length?table(['รายการอื่น','คงเหลือ','หน่วย'],db.stock.filter(s=>!db.ingredients.some(x=>x[0]===s.name)).map(x=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>${x.unit}</td></tr>`).join('')):''}<div class="warn">สต็อกเพิ่มตามจำนวนรับเข้าจริงจากแผนซื้อและรายการปรับยอดด้วยตนเอง การตัดวัตถุดิบจากยอดขายจะเชื่อมในขั้นผูกสูตรกับเมนู</div>`;
if(page==='accounts')html=`<div class="head"><h2>บัญชีร้าน</h2><div><button class="primary" onclick="addSale()">+ รายรับ</button> <button onclick="addExpense()">+ รายจ่าย</button></div></div>${table(['วันที่','ประเภท','รายการ','จำนวนเงิน','ผู้บันทึก','จัดการ'],[...db.sales.map((x,i)=>`<tr><td>${x.date}</td><td>รายรับ</td><td>${x.name}</td><td>${money(x.amount)}</td><td>${x.by}</td><td><button onclick="del('sales',${i})">ลบ</button></td></tr>`),...db.expenses.map((x,i)=>`<tr><td>${x.date}</td><td>รายจ่าย</td><td>${x.name}</td><td>${money(x.amount)}</td><td>${x.by}</td><td><button onclick="del('expenses',${i})">ลบ</button></td></tr>`)].join(''))}`;
if(page==='finance')html=`<div class="grid"><div class="card">รายรับ<div class="metric">${money(rev)}</div></div><div class="card">รายจ่าย<div class="metric">${money(exp)}</div></div><div class="card">คงเหลือจากรายการ<div class="metric">${money(rev-exp)}</div></div><div class="card owner-only">บัญชีส่วนตัวเจ้าของ<div class="metric">แยกสิทธิ์</div></div></div><div class="warn">กำไรสุทธิต้องหักต้นทุนขายตามสูตร ค่าแรง ค่าเช่า ค่าขนส่ง และค่าใช้จ่ายอื่นให้ครบ ข้อมูลส่วนตัวเจ้าของไม่แสดงแก่พนักงาน</div><button class="primary" onclick="addExpense()">+ เพิ่มรายจ่าย</button>`;
if(page==='staff')html=`<div class="head"><h2>พนักงานและค่าแรง</h2><button class="primary" onclick="addStaff()">+ เพิ่มพนักงาน</button></div>${table(['ชื่อ','ตำแหน่ง','ค่าแรง/ชม.','ชั่วโมง','ค่าแรงรวม','จัดการ'],db.staff.map((x,i)=>`<tr><td>${x.name}</td><td>${x.job}</td><td>${money(x.rate)}</td><td>${x.hours}</td><td>${money(x.rate*x.hours)}</td><td><button onclick="del('staff',${i})">ลบ</button></td></tr>`).join(''))}<div class="warn">เจ้าของจัดการบัญชีและสิทธิ์ผู้ใช้เท่านั้น พนักงานดูข้อมูลร้านตามสิทธิ์ที่กำหนด</div>`;
if(page==='reports')html=`<div class="grid"><div class="card">ยอดขาย<div class="metric">${money(rev)}</div></div><div class="card">รายจ่าย<div class="metric">${money(exp)}</div></div><div class="card">ออเดอร์<div class="metric">${db.sales.length}</div></div><div class="card">วัตถุดิบ<div class="metric">${db.ingredients.length}</div></div></div>${table(['เมนู','ราคาขาย'],db.products.map(x=>`<tr><td>${x[0]}</td><td>${money(x[2])}</td></tr>`).join(''))}`;
if(page==='settings')html=`<div class="card"><h2>ตั้งค่าร้าน</h2><p>ชื่อระบบ: RollLerd POS & Business</p><p>แบรนด์: โรลเลิศ โรลดี</p><p>ภาษา: ไทย / อังกฤษ · สกุลเงิน: THB</p><div class="warn">${cloudReady?"เชื่อมต่อ Supabase แล้ว: ข้อมูลหลักซิงก์ผ่านบัญชีเจ้าของร้าน และมีสำเนาในเบราว์เซอร์เครื่องนี้":"ยังไม่ได้เชื่อมต่อ Supabase: ข้อมูลที่แก้ไขจะอยู่ในเบราว์เซอร์เครื่องนี้ก่อน"} การสลับ role เป็นเพียงตัวอย่าง ไม่ใช่ระบบรักษาความปลอดภัยจริง</div><button onclick="let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rolllerd-data.json';a.click()">ส่งออกข้อมูล JSON</button> <button onclick="if(confirm('คืนค่าเริ่มต้น?')){localStorage.removeItem('rolllerd_full');location.reload()}">คืนค่าเริ่มต้น</button></div>`;
$('content').innerHTML=html;if(role==='staff')document.querySelectorAll('.owner-only').forEach(x=>x.style.display='none');
}
$('date').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
$('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b){page=b.dataset.p;render()}};

$('add').onclick=()=>({tasks:addTask,plans:addPlan,products:addProduct,ingredients:addIngredient,recipes:addRecipe,sales:addSale,stock:addStock,accounts:addExpense,finance:addExpense,staff:addStaff}[page]||addSale)();
$('lang').onclick=()=>alert('กำลังเตรียมคำแปลภาษาอังกฤษครบทุกหน้าในขั้นต่อไป');
function setCloudStatus(msg){const el=$('authStatus');if(el)el.textContent=msg;}
async function startOwnerSession(){
 try{
  setCloudStatus('กำลังโหลดข้อมูลร้านจากฐานข้อมูล...');
  const remote=await RollLerdCloud.loadState();
  if(remote){db=remote.data;cloudVersion=remote.version;localStorage.setItem('rolllerd_full',JSON.stringify(db));}
  else {cloudVersion=0;await RollLerdCloud.saveState(db,cloudVersion).then(v=>cloudVersion=v.version);}
  cloudReady=true;$('authGate').classList.add('hidden');render();setCloudStatus('เชื่อมต่อฐานข้อมูลแล้ว');
 }catch(e){cloudReady=false;setCloudStatus('เชื่อมต่อไม่สำเร็จ: '+(e.message||e));$('authGate').classList.remove('hidden');}
}
$('authLogin').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password){setCloudStatus('กรุณากรอกอีเมลและรหัสผ่าน');return;}try{$('authLogin').disabled=true;setCloudStatus('กำลังเข้าสู่ระบบ...');await RollLerdCloud.signIn(email,password);await startOwnerSession();}catch(e){setCloudStatus('เข้าสู่ระบบไม่สำเร็จ: '+(e.message||e));}finally{$('authLogin').disabled=false;}};
$('signOut').onclick=async()=>{if(!confirm('ออกจากระบบเจ้าของร้าน?'))return;cloudReady=false;await RollLerdCloud.signOut();$('authGate').classList.remove('hidden');setCloudStatus('ออกจากระบบแล้ว');};
(async()=>{try{await RollLerdCloud.init();const session=await RollLerdCloud.getSession();if(session)await startOwnerSession();else{$('authGate').classList.remove('hidden');setCloudStatus('กรุณาเข้าสู่ระบบเจ้าของร้าน');}}catch(e){$('authGate').classList.remove('hidden');setCloudStatus('ตั้งค่า Supabase ไม่ครบ: '+(e.message||e));}})();
</script></body></html>
